[package]
name = "braze-model"
description = "ModelBackend trait and streaming LLM provider implementations (Anthropic, Ollama)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
braze-types = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# LocalBackend (feature `local`): inferencia in-process sobre llama.cpp,
# reusando los GGUF de Ollama. Opcional y off por default — compila
# llama.cpp (C++), pesado, no debe entrar en el build normal del
# workspace. Ver docs/local-backend-design-2026-07-20.md.
llama-cpp-2 = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }

[features]
local = ["dep:llama-cpp-2", "dep:encoding_rs"]
# `cuda` = local + offload GPU (llama.cpp compilado con CUDA). Requiere
# el CUDA toolkit (nvcc) en el host de build. Se usa en Nitro (RTX 3050);
# la máquina de trabajo sin GPU compila solo `local` (CPU). Ver
# docs/local-backend-design-2026-07-20.md § Fase 2.
cuda = ["local", "llama-cpp-2/cuda"]
