[package]
name = "braze-tools-local"
description = "Built-in local tools (file read/write/edit, shell exec, grep/glob) implementing ToolProvider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
braze-types = { workspace = true }
braze-tools-core = { workspace = true }
braze-permissions = { workspace = true }
# v4 P1.6: `FormatterConfig` (per-extension post-edit command map) lives
# here — no cycle: braze-config stays a Nivel-0 leaf (no deps on any
# other braze-* crate), and braze-tools-local sits at Nivel 2.
braze-config = { workspace = true }
async-trait = { workspace = true }
# Workspace tokio doesn't enable "fs" (see workspace Cargo.toml); this
# crate's unit tests create/read/write throwaway fixture files via
# tokio::fs. Added locally, same precedent as braze-session's Cargo.toml.
tokio = { workspace = true, features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The post-edit check guardrail (post_edit_check.rs) reports its skip
# reasons (cargo missing, timeout) at trace level only — they must never
# surface as tool-result noise.
tracing = { workspace = true }
syn = { version = "3.0.3", features = ["full", "parsing"] }

[dev-dependencies]
# Unique throwaway fixture-project dirs for the post-edit check tests.
uuid = { workspace = true }
