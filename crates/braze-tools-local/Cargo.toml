[package]
name = "braze-tools-local"
description = "Built-in local tools (file read/write/edit, shell exec, grep/glob) implementing ToolProvider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
braze-types = { workspace = true }
braze-tools-core = { workspace = true }
braze-permissions = { workspace = true }
async-trait = { workspace = true }
# Workspace tokio doesn't enable "fs" (see workspace Cargo.toml); this
# crate's unit tests create/read/write throwaway fixture files via
# tokio::fs. Added locally, same precedent as braze-session's Cargo.toml.
tokio = { workspace = true, features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
