skill = "localizacion"
prompt = "En src/lib.rs, la funcion peso_lote_39 usa un factor de ajuste de 0.01. Cambialo a 0.07 sin tocar ninguna otra funcion peso_lote."
expect_cargo_check = true
expect_file_contains = { "src/lib.rs" = ["let ajuste = 39.0 * 0.07;", "let ajuste = 38.0 * 0.01;"] }
expect_max_rounds = 8

[tasks.setup_files]
"Cargo.toml" = '''
[package]
