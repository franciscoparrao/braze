expect_max_rounds = 8

[tasks.setup_files]
"Cargo.toml" = '''
[package]
name = "inventory"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
'''
"src/lib.rs" = '''

#[derive(Debug, Clone, PartialEq)]
pub struct Item {
    pub sku: String,
    pub cantidad: u32,
    pub precio_centavos: u64,
}

impl Item {
    pub fn new(sku: &str, cantidad: u32, precio_centavos: u64) -> Self {
        Self { sku: sku.to_string(), cantidad, precio_centavos }
    }

    /// Valor total de la linea, en centavos.
    pub fn valor_total(&self) -> u64 {
        self.precio_centavos * u64::from(self.cantidad)
    }

    pub fn esta_agotado(&self) -> bool {
        self.cantidad == 0
    }
}

#[derive(Debug, Default)]
pub struct Almacen {
    items: Vec<Item>,
}

impl Almacen {
    pub fn new() -> Self {
        Self { items: Vec::new() }
    }

    pub fn agregar(&mut self, item: Item) {
        self.items.push(item);
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Valor total del inventario, en centavos.
    pub fn valor_inventario(&self) -> u64 {
        self.items.iter().map(Item::valor_total).sum()
    }

    pub fn agotados(&self) -> Vec<&Item> {
        self.items.iter().filter(|i| i.esta_agotado()).collect()
    }

    pub fn buscar(&self, sku: &str) -> Option<&Item> {
        self.items.iter().find(|i| i.sku == sku)
    }
}



/// Devuelve el peso ajustado del lote 1.
pub fn peso_lote_1(base: f64) -> f64 {
    let ajuste = factor_legado() * 1.0 * 0.01;
    base * (1.0 + ajuste)
}

/// Devuelve el peso ajustado del lote 2.
pub fn peso_lote_2(base: f64) -> f64 {
    let ajuste = factor_legado() * 2.0 * 0.01;
    base * (1.0 + ajuste)
}
'''

