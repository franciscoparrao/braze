# Banco COMBINADO round-economics v1 — 53 tareas (2026-08-08)
#
# QUE ES. La union literal de `default.toml` (19) y `discriminating.toml`
# (34), sin editar una sola tarea. Existe porque el piloto de costo de
# round-economics necesita un par modelo-banco que este a la vez EN BANDA
# y con RESOLUCION, y ninguno de los dos bancos por separado lo daba para
# los modelos que entran enteros en la GPU de Nitro:
#
#   qwen2.5:3b x default.toml        15/19 = 79%  -> banda alta, 5,3 pp/item
#   qwen2.5:3b x discriminating.toml  1/6  = 17%  -> piso,        2,9 pp/item
#   gemma-4-E4B x discriminating.toml 1/6  = 17%  -> piso, y 12x mas caro
#
# discriminating.toml fue construida para gpt-oss:20b y no discrimina por
# debajo de esa clase; default.toml discrimina para 3B pero tiene el techo
# cerca. Juntarlas pone a qwen2.5:3b cerca del 40% (centro) con 1,9 pp por
# item — mejor resolucion que cualquiera de las dos solas.
#
# POR QUE LA UNION Y NO UNA SELECCION. Elegir items por dificultad
# observada es seleccionar sobre el resultado. La union es una regla
# declarada antes de mirar el efecto, y el chequeo de salud de banco del
# bench (tecnica #2, docs/irt-suites-2026-08-07.md) reporta despues que
# items no discriminaron — diagnostico post-hoc, no filtro previo.
#
# ADVERTENCIA. Banco NUEVO: no tiene piso de ruido propio medido. El
# piloto que lo estrena reporta ese piso como su PRIMER entregable, antes
# que cualquier efecto (docs/round-economics-pilot-costo-2026-08-08.md).
#
# REQUISITOS DE CORRIDA heredados de discriminating.toml:
#   - `source ~/.cargo/env` antes de lanzar (si no, el grading califica
#     TODO como fallado y el post-edit check se salta en silencio).
#   - BRAZE_OLLAMA_NUM_CTX=32768, BRAZE_MAX_TOKENS=12288.

