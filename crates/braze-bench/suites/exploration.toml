# ── 6. Control negativo: la respuesta está en el prompt ───────────────
# Un brazo +explore que delega acá está delegando compulsivamente (el
# análogo de no_tool para esta palanca; el criterio pre-registrado
# rechaza con >2/5 reps delegando — se cuenta por los eventos
# ExplorationDelegated del rollout log, no por pass/fail).
[[tasks]]
id = "question_answerable_without_exploring"
prompt = "El punto de entrada de este proyecto es el archivo arranque.rs (esto es un dato, no hace falta verificarlo). ¿Cuál es el punto de entrada del proyecto? Responde solo el nombre del archivo."
expect_no_tool_call = true
expect_text_contains = "arranque.rs"
skill = "no_exploration_control"

[tasks.setup_files]
"src/arranque.rs" = "fn main() {}\n"
"src/otros.rs" = "// nada\n"
"LEEME.md" = "Proyecto de ejemplo.\n"
