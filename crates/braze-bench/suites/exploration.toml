# ── 2. Definición de función entre 12 fuentes ─────────────────────────
[[tasks]]
id = "find_function_definition"
prompt = "¿En qué archivo del directorio src/ se DEFINE la función parse_frame? Responde solo la ruta del archivo."
expect_text_contains = "codec.rs"
expect_max_tokens = 25000
skill = "exploration"

[tasks.setup_files]
"src/main.rs" = "mod codec;\nmod red;\nfn main() {\n    let f = codec::parse_frame(&datos);\n}\n"
"src/codec.rs" = "/// Decodifica un frame del wire.\npub fn parse_frame(bytes: &[u8]) -> Frame {\n    Frame::from(bytes)\n}\n"
"src/red.rs" = "pub fn conectar(host: &str) -> Conexion {\n    Conexion::nueva(host)\n}\n"
"src/buffer.rs" = "pub fn reservar(n: usize) -> Vec<u8> {\n    vec![0; n]\n}\n"
"src/checksum.rs" = "pub fn crc32(datos: &[u8]) -> u32 {\n    datos.iter().fold(0, |a, b| a ^ *b as u32)\n}\n"
"src/reloj.rs" = "pub fn ahora_ms() -> u64 {\n    0\n}\n"
"src/log.rs" = "pub fn registrar(msg: &str) {\n    println!(\"{msg}\");\n}\n"
"src/config.rs" = "pub fn cargar() -> Config {\n    Config::default()\n}\n"
"src/cliente.rs" = "use crate::codec;\npub fn recibir(c: &Conexion) {\n    let _ = codec::parse_frame(c.leer());\n}\n"
"src/servidor.rs" = "pub fn escuchar(puerto: u16) {\n    // acepta conexiones\n}\n"
"src/errores.rs" = "pub enum Error {\n    Conexion,\n    Formato,\n}\n"
"src/tipos.rs" = "pub struct Frame {\n    pub datos: Vec<u8>,\n}\n"

