# Suite del A/B del explorador aislado (I.7,
# docs/explorador-aislado-ab-design.md — diseño y criterio
# pre-registrados el 2026-07-11, commit 4517b6d; suite escrita
# 2026-07-19 junto a la implementación del mecanismo).
#
# El suite default no ejercita búsqueda-amplia: sus tareas apuntan al
# archivo por nombre. Estas 6 tareas ponen la respuesta en UNO de 12-15
# archivos de setup y el resto es ruido plausible — miden si delegar la
# exploración a un hijo aislado (+ablate:explore) mejora pass rate y/o
# reduce tokens frente a explorar inline, CON EL MISMO MODELO en ambos
# roles.
#
# Brazos del A/B (2 executors × 4 brazos × 6 tareas × 5 reps = 240):
#   ollama:qwen2.5:3b                     → baseline (explora inline)
#   ollama:qwen2.5:3b+ablate:explore      → la palanca completa
#   ollama:qwen2.5:3b+ablate:explore;no-prune → ¿el aislamiento subsume al colapso?
#   ollama:qwen2.5:3b+ablate:no-prune     → referencia sin colapso
# (ídem qwen2.5:7b)
#
# expect_max_tokens en las tareas 1-3 (por diseño): acota la patología
# de ventana (los loops de 30-48K tokens observados en fig. 3 del
# paper), no el uso normal — un pass que quema la ventana no valida la
# palanca. Los tokens del hijo CUENTAN (Usage agregado
# stop_reason=exploration_child, ver crates/braze-engine/src/exploration.rs).

