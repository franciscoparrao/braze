id = "tres_archivos_coordinados"
skill = "techo"
prompt = "Agrega al crate un modulo nuevo src/descuento.rs con una funcion publica `aplicar(item: &Item, porcentaje: u32) -> u64` que devuelva el valor_total del item menos ese porcentaje (redondeando hacia abajo). Declaralo en lib.rs, y usalo desde src/reporte.rs agregando una funcion publica `linea_con_descuento(item: &Item, porcentaje: u32) -> String`. El crate tiene que compilar."
expect_cargo_check = true
expect_file_contains = { "src/lib.rs" = ["mod descuento"], "src/descuento.rs" = ["pub fn aplicar"], "src/reporte.rs" = ["linea_con_descuento"] }
expect_max_rounds = 22

