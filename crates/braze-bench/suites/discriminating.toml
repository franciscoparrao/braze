# Suite DISCRIMINANTE v2 — 34 tareas (2026-07-27)
#
# POR QUE MAS TAREAS Y NO MAS REPLICAS. Con las 8 de la v1, cada item pesa
# 12.5 pp y la discordancia medida entre corridas IDENTICAS (1-2 tareas) se
# come cualquier interaccion plausible: un factorial 2x2 necesitaria un
# efecto de 3+ tareas para ser visible. Con 34, cada item pesa ~3 pp.
# La resolucion de un banco la fija el NUMERO DE ITEMS; las replicas solo
# estiman su ruido. Ver docs/noise-floor-2026-07-26.md.
#
# Y las tareas nuevas son BARATAS a proposito: el costo de reloj lo fija el
# costo por item, no su cantidad. Discriminar no exige tareas largas sino
# tareas cerca de la frontera del modelo, y varias de esas fronteras se
# prueban en pocas rondas.
#
# ESCALERAS, no solo dificultad. El ejercicio roam (2026-07-26) dejo que
# gpt-oss:20b acierta ediciones de 1 linea y falla movimientos de 216. Las
# familias `escalera_*` convierten ese hecho en una CURVA MEDIDA en vez de
# un punto: borrado de 2/6/12/20/30 funciones, movimiento de 1/3/8,
# consistencia sobre 2/5/10 usos, y 1/2/3/4 errores de compilacion. Donde
# la curva cae es el dato.
#
# Oraculo: `expect_cargo_check = true` en todas -- el compilador, no un
# substring. Las aserciones de contenido son ADEMAS, y ninguna se satisface
# sin hacer el trabajo (leccion de la v1: `borrar_bloque_deprecado` era
# vacua porque el crate ya compilaba).
#
# REQUISITOS DE CORRIDA, no opcionales:
#   - `source ~/.cargo/env` antes de lanzar. Sin cargo en el PATH el grading
#     califica TODO como fallado y el post-edit check se salta en silencio.
#   - BRAZE_OLLAMA_NUM_CTX=32768, BRAZE_MAX_TOKENS=12288.
#   - --task-timeout-secs 900. NO 300: un tope que muerde binariza el ruido
#     continuo de walltime y lo amplifica (con 300s el baseline de la v1
#     oscilaba 7/4/3; con 900s, 6/6/6).

[[tasks]]
id = "borrar_2_funciones"
skill = "escalera_borrado"
prompt = "El crate no compila: las 2 funciones peso_lote_* del final llaman a `factor_legado()`, un helper ya eliminado. Borra TODAS las funciones peso_lote_* que lo llamen. No toques Item ni Almacen ni reintroduzcas el helper."
expect_cargo_check = true
expect_file_contains = { "src/lib.rs" = ["pub struct Item", "pub struct Almacen"] }
expect_max_rounds = 8

[tasks.setup_files]
"Cargo.toml" = '''
[package]
name = "inventory"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
'''
"src/lib.rs" = '''

#[derive(Debug, Clone, PartialEq)]
pub struct Item {
    pub sku: String,
    pub cantidad: u32,
    pub precio_centavos: u64,
}

impl Item {
    pub fn new(sku: &str, cantidad: u32, precio_centavos: u64) -> Self {
        Self { sku: sku.to_string(), cantidad, precio_centavos }
    }

    /// Valor total de la linea, en centavos.
    pub fn valor_total(&self) -> u64 {
        self.precio_centavos * u64::from(self.cantidad)
    }

    pub fn esta_agotado(&self) -> bool {
        self.cantidad == 0
    }
}

#[derive(Debug, Default)]
pub struct Almacen {
    items: Vec<Item>,
}

impl Almacen {
    pub fn new() -> Self {
        Self { items: Vec::new() }
    }

    pub fn agregar(&mut self, item: Item) {
        self.items.push(item);
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Valor total del inventario, en centavos.
    pub fn valor_inventario(&self) -> u64 {
        self.items.iter().map(Item::valor_total).sum()
    }

    pub fn agotados(&self) -> Vec<&Item> {
        self.items.iter().filter(|i| i.esta_agotado()).collect()
    }

    pub fn buscar(&self, sku: &str) -> Option<&Item> {
        self.items.iter().find(|i| i.sku == sku)
    }
}



/// Devuelve el peso ajustado del lote 1.
pub fn peso_lote_1(base: f64) -> f64 {
    let ajuste = factor_legado() * 1.0 * 0.01;
    base * (1.0 + ajuste)
}

/// Devuelve el peso ajustado del lote 2.
pub fn peso_lote_2(base: f64) -> f64 {
    let ajuste = factor_legado() * 2.0 * 0.01;
    base * (1.0 + ajuste)
}
'''

