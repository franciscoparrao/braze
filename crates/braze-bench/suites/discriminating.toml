# Suite DISCRIMINANTE — 2026-07-26
#
# Por que existe: `default.toml` esta SATURADO. Medido en
# docs/noise-floor-2026-07-26.md — gpt-oss:20b saca 57/57 con CERO
# discordantes entre corridas identicas, y en gemma4:e4b solo 5 de 57 tareas
# son inestables (casi todas de error_recovery). Un banco donde casi todo se
# pasa o casi todo es ruido no puede detectar ni mejora ni regresion: no
# tiene poder de medicion para el modelo principal del proyecto.
#
# Calibracion (no es intuicion): el ejercicio roam del mismo dia acoto el
# limite de gpt-oss por ambos lados — resuelve ediciones quirurgicas (dos
# arreglos de una linea en 157s, a la primera) y falla movimientos de 216
# lineas (dos edit_file sin match exacto, una reescritura cortada por
# presupuesto). Las tareas que discriminan viven ENTRE esos dos puntos.
#
# Gradiente explicito por `skill`:
#   piso   — deberia pasarlas; si fallan, se rompio el harness, no el modelo
#   banda  — donde se espera resolucion de medicion real
#   techo  — en o sobre el punto de falla conocido; define el extremo duro
#
# Los fixtures son crates Rust reales con `expect_cargo_check = true`: el
# oraculo es el compilador, no un substring. Y los archivos pasan de 200
# lineas a proposito, para forzar lecturas paginadas — que es lo que ejercita
# el colapso ACI y la relectura, invisibles en default.toml (prompts ~1300
# tokens que nunca se acercan al limite).
#
# CALIBRACION (2026-07-26, gpt-oss:20b, 1 rep, temp 0, ctx 32768/max 12288):
#   PASS 6/8 — piso 2/2, banda 3/4, techo 1/2.
# Compara con default.toml en el mismo modelo: 57/57 y CERO discordantes.
# La suite tiene margen de medicion; default.toml no tenia ninguno.
#
# Los dos fallos, y por que importan sus firmas:
#   - mover_almacen_completo (techo): timeout a 300s tras 14 rondas, pero
#     con los archivos esperados YA creados y correctos — lo que faltaba era
#     que compilara. Alcanzable en principio, fuera de presupuesto en la
#     practica. Es el comportamiento buscado para el extremo duro.
#   - mover_item_a_modulo_nuevo (banda): `model_backend_error` — la ronda
#     genero 12 tokens que el harness no pudo mapear (solo canal analysis).
#     NO mide capacidad: es un hermano del bug de ronda vacia arreglado el
#     mismo dia (aquel era 0 tokens; este es "genero tokens pero ninguno
#     alcanzable"). Pendiente de cubrir.
#
# REQUISITOS DE CORRIDA, no opcionales:
#   - `source ~/.cargo/env` antes de lanzar. Sin `cargo` en el PATH, el
#     grading de expect_cargo_check califica TODO como fallado y el
#     post-edit check del harness se salta en silencio: la primera
#     calibracion dio 0/8 por esto y no por el modelo.
#   - BRAZE_OLLAMA_NUM_CTX=32768 y BRAZE_MAX_TOKENS=12288. Con los defaults
#     (8192/4096) las tareas se estrangulan por presupuesto, no por
#     capacidad — medido en el ejercicio roam del mismo dia.
#
# Nota de gradiente: `tres_archivos_coordinados` (techo) paso mientras
# `mover_item_a_modulo_nuevo` (banda) fallo. Con n=1 y sabiendo que ese
# fallo fue artefacto, no se reordena todavia: hace falta mas evidencia.

[[tasks]]
id = "fix_dos_errores_una_linea"
skill = "piso"
prompt = "El crate no compila. Hay exactamente dos errores en src/lib.rs, ambos de una linea: la funcion valor_total multiplica por self.sku en vez de self.cantidad, y esta_agotado compara con la cadena vacia en vez de con 0. Arregla esos dos puntos y nada mas."
expect_cargo_check = true
expect_file_contains = { "src/lib.rs" = ["u64::from(self.cantidad)", "self.cantidad == 0"] }
expect_max_rounds = 10

[tasks.setup_files]
"Cargo.toml" = '''
[package]
name = "inventory"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
'''
"src/lib.rs" = '''

#[derive(Debug, Clone, PartialEq)]
pub struct Item {
    pub sku: String,
    pub cantidad: u32,
    pub precio_centavos: u64,
}

impl Item {
    pub fn new(sku: &str, cantidad: u32, precio_centavos: u64) -> Self {
        Self { sku: sku.to_string(), cantidad, precio_centavos }
    }

    /// Valor total de la linea, en centavos.
    pub fn valor_total(&self) -> u64 {
        self.precio_centavos * u64::from(self.sku)
    }

    pub fn esta_agotado(&self) -> bool {
        self.cantidad == ""
    }
}

#[derive(Debug, Default)]
pub struct Almacen {
    items: Vec<Item>,
}

impl Almacen {
    pub fn new() -> Self {
        Self { items: Vec::new() }
    }

    pub fn agregar(&mut self, item: Item) {
        self.items.push(item);
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Valor total del inventario, en centavos.
    pub fn valor_inventario(&self) -> u64 {
        self.items.iter().map(Item::valor_total).sum()
    }

    pub fn agotados(&self) -> Vec<&Item> {
        self.items.iter().filter(|i| i.esta_agotado()).collect()
    }

    pub fn buscar(&self, sku: &str) -> Option<&Item> {
        self.items.iter().find(|i| i.sku == sku)
    }
}


