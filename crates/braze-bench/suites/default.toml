# Suite por defecto de braze-bench: tareas resolubles con acciones
# "Reversible" (ver PermissionGuard/DefaultClassifier) dentro del sandbox
# aislado por corrida — el harness deniega cualquier acción "Irreversible"
# por diseño (ver PLAN.md), así que ninguna tarea debería necesitar una
# para completarse con éxito.
#
# Gradiente de dificultad (campo `skill`, ver docs/AUDITORIA-2026-07.md
# hallazgo F8): las primeras 7 tareas son single_tool (una sola llamada,
# un solo paso) — el piso que casi cualquier modelo con tool-calling
# nativo debería despejar. Las siguientes suben la dificultad para
# separar "sabe llamar una tool" de "puede encadenar pasos, recuperarse de
# un nombre equivocado, o elegir entre distractores" — sin ese gradiente
# el reporte no puede mostrar *dónde* se rompe la capacidad de un modelo
# chico, solo que se rompió en algún punto.
#
# E3 (docs/AUDITORIA-2026-07-v3.md): no_tool/multi_step/error_recovery/
# distractor_selection tenían n=1 cada una — sin poder estadístico
# alguno, un pass/fail de una sola tarea es indistinguible de ruido de
# muestreo. Ampliadas a n=3 cada una (más una segunda tarea de edición,
# ya que write/edit estaba subrepresentado frente a read/grep/glob).

[[tasks]]
id = "read_file_basic"
prompt = "Lee el archivo notas.txt del directorio actual y dime cuántas líneas tiene."
expect_tool_call = "read_file"
expect_text_contains = "3"
skill = "single_tool"

[tasks.setup_files]
"notas.txt" = "linea uno\nlinea dos\nlinea tres\n"

[[tasks]]
id = "grep_basic"
prompt = "Busca la palabra ERROR en el archivo datos.txt y dime en qué línea aparece."
expect_tool_call = "grep"
skill = "single_tool"

[tasks.setup_files]
"datos.txt" = "inicio del programa\nERROR: fallo de conexion\nfin del programa\n"

[[tasks]]
id = "glob_basic"
prompt = "Lista todos los archivos con extensión .rs en el directorio actual."
expect_tool_call = "glob"
skill = "single_tool"

[tasks.setup_files]
"a.rs" = "// archivo a\n"
"b.rs" = "// archivo b\n"
"notas.txt" = "no es un archivo rust\n"

[[tasks]]
id = "write_file_basic"
prompt = "Crea un archivo llamado saludo.txt en el directorio actual con el contenido 'hola mundo'."
expect_tool_call = "write_file"
skill = "single_tool"

# Verificado contra el filesystem real del sandbox, no solo "se llamó
# write_file" — una llamada fallida o un no-op también satisfarían
# expect_tool_call, pero no esto (ver hallazgo F4).
[tasks.expect_file_contains]
"saludo.txt" = "hola mundo"

[[tasks]]
id = "edit_file_basic"
prompt = "Edita el archivo config.txt del directorio actual y cambia 'version=1' por 'version=2'."
expect_tool_call = "edit_file"
skill = "single_tool"

[tasks.setup_files]
"config.txt" = "version=1\n"

[tasks.expect_file_contains]
"config.txt" = "version=2"

[[tasks]]
id = "shell_exec_basic"
prompt = "Ejecuta el comando `ls` en el directorio actual y dime qué archivos ves."
expect_tool_call = "shell_exec"
skill = "single_tool"

[tasks.setup_files]
"uno.txt" = "contenido uno\n"
"dos.txt" = "contenido dos\n"

[[tasks]]
id = "no_tool_qa"
prompt = "¿Cuánto es 2+2? Responde solo con el número, sin usar ninguna herramienta."
expect_no_tool_call = true
expect_text_contains = "4"
skill = "no_tool"

[[tasks]]
id = "multi_step_read_count_write"
prompt = "Lee el archivo resumen.txt del directorio actual, cuenta cuántas líneas tiene, y escribe ese número (solo el número, sin texto adicional) en un archivo nuevo llamado conteo.txt."
skill = "multi_step"

[tasks.setup_files]
"resumen.txt" = "linea a\nlinea b\nlinea c\n"

[tasks.expect_file_contains]
"conteo.txt" = "3"

[[tasks]]
id = "error_recovery_wrong_filename"
prompt = "Lee el archivo de informe del directorio actual (el nombre empieza con 'informe' pero no recuerdo el resto) y dime cuántas líneas tiene."
expect_text_contains = "2"
skill = "error_recovery"

# El prompt deliberadamente no da el nombre exacto — el modelo tiene que
# recuperarse de un primer read_file fallido (o usar glob/grep primero)
# en vez de repetir la misma llamada o rendirse.
[tasks.setup_files]
"informe_final_v2.txt" = "dato uno\ndato dos\n"

[[tasks]]
id = "distractor_selection_among_files"
prompt = "Hay varios archivos .txt en el directorio actual. Busca cuál de ellos menciona la palabra 'presupuesto' y dime el nombre de ese archivo."
expect_text_contains = "notas_presupuesto"
skill = "distractor_selection"

[tasks.setup_files]
"notas_viaje.txt" = "necesitamos reservar el vuelo y el hotel\n"
"notas_presupuesto.txt" = "el presupuesto total del proyecto es 5000\n"
"notas_equipo.txt" = "el equipo tiene cuatro integrantes\n"

# --- E3: ampliación a n=3 en las skills débiles + segunda tarea de edición ---

[[tasks]]
id = "edit_file_function_body"
prompt = "Edita el archivo saludo.py del directorio actual: cambia el mensaje que imprime la función de 'Hola' a 'Adios'."
expect_tool_call = "edit_file"
skill = "single_tool"

[tasks.setup_files]
"saludo.py" = "def saludar(nombre):\n    print(f\"Hola, {nombre}!\")\n\nsaludar(\"Ana\")\n"

[tasks.expect_file_contains]
"saludo.py" = "Adios"

[[tasks]]
id = "no_tool_capital_question"
prompt = "¿Cuál es la capital de Perú? Responde solo con el nombre de la ciudad, sin usar ninguna herramienta."
expect_no_tool_call = true
expect_text_contains = "lima"
skill = "no_tool"

[[tasks]]
id = "no_tool_subtraction"
prompt = "¿Cuánto es 10 menos 3? Responde solo con el número, sin usar ninguna herramienta."
expect_no_tool_call = true
expect_text_contains = "7"
skill = "no_tool"

[[tasks]]
id = "multi_step_sum_two_files"
prompt = "Lee los archivos a.txt y b.txt del directorio actual, suma la cantidad de líneas que tiene cada uno, y escribe el total (solo el número, sin texto adicional) en un archivo nuevo llamado total.txt."
skill = "multi_step"

[tasks.setup_files]
"a.txt" = "linea 1\nlinea 2\n"
"b.txt" = "linea 1\nlinea 2\nlinea 3\n"

[tasks.expect_file_contains]
"total.txt" = "5"

[[tasks]]
id = "multi_step_multiply_and_write"
prompt = "Lee el archivo precio.txt del directorio actual (contiene un solo número), multiplica ese número por 3, y escribe el resultado (solo el número, sin texto adicional) en un archivo nuevo llamado total_final.txt."
skill = "multi_step"

[tasks.setup_files]
"precio.txt" = "5\n"

[tasks.expect_file_contains]
"total_final.txt" = "15"

[[tasks]]
id = "error_recovery_wrong_config_extension"
prompt = "Lee el archivo de configuración del directorio actual (el nombre empieza con 'config' pero no recuerdo la extensión) y dime qué valor tiene la clave 'modo'."
expect_text_contains = "activo"
skill = "error_recovery"

# Igual que error_recovery_wrong_filename: el prompt no da el nombre
# exacto, forzando glob/grep o un read_file fallido antes de encontrar el
# archivo real.
[tasks.setup_files]
"config.yaml" = "modo: activo\n"

[[tasks]]
id = "error_recovery_edit_wrong_filename"
prompt = "Edita el archivo de ajustes del proyecto (no recuerdo el nombre exacto, pero tiene que ver con la configuración de la app) y cambia 'timeout=30' por 'timeout=60'."
skill = "error_recovery"

# Sin expect_tool_call: recuperarse vía write_file (la propia señal de
# error de edit_file sugiere ese camino) cuenta igual que recuperarse vía
# edit_file — lo que importa es el resultado en el archivo, no la ruta.
[tasks.setup_files]
"ajustes_app.ini" = "timeout=30\n"

[tasks.expect_file_contains]
"ajustes_app.ini" = "timeout=60"

[[tasks]]
id = "distractor_selection_log_with_error"
prompt = "Hay varios archivos .txt en el directorio actual. Busca cuál de ellos contiene la palabra 'ERROR' y dime el nombre de ese archivo."
expect_text_contains = "log_fail"
skill = "distractor_selection"

[tasks.setup_files]
"log_ok.txt" = "todo funciona correctamente\n"
"log_fail.txt" = "ERROR: fallo critico en el modulo de pagos\n"
"log_info.txt" = "informacion general del sistema\n"

[[tasks]]
id = "distractor_selection_debug_config"
prompt = "Entre los archivos de configuración del directorio actual, identifica cuál tiene 'debug=true' y dime su nombre."
expect_text_contains = "config_dev"
skill = "distractor_selection"

[tasks.setup_files]
"config_dev.txt" = "debug=true\nport=3000\n"
"config_prod.txt" = "debug=false\nport=80\n"
"config_test.txt" = "debug=false\nport=8080\n"
