# Suite del A/B potenciado de la palanca de verificación (H2).
# docs/verification-lever-design-2026-07-22.md. 20 bugs de compilación
# Rust verificados; criterio de pass = cargo check (expect_cargo_check).

[[tasks]]
id = "rust_borrow_after_use"
skill = "verify"
prompt = "Fix src/lib.rs so cargo check passes. Keep the public function names unchanged."
expect_cargo_check = true

[tasks.setup_files]
"Cargo.toml" = "[package]\nname = \"vfix\"\nversion = \"0.1.0\"\nedition = \"2021\"\n\n[lib]\npath = \"src/lib.rs\"\n"
"src/lib.rs" = "pub struct Store {\n    items: Vec<String>,\n}\n\nimpl Store {\n    pub fn new(items: Vec<String>) -> Self { Self { items } }\n    pub fn push_and_first(&mut self, value: String) -> Option<String> {\n        let first = self.items.first();\n        self.items.push(value);\n        first.cloned()\n    }\n}\n"

