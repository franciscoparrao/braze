# Suite NUCLEO RAPIDO — 13 tareas (2026-07-27)
#
# Subconjunto de `discriminating.toml` elegido por un criterio MEDIDO, no
# por intuicion: son las familias cuyas tareas se resuelven en pocas rondas
# y que, en 3 replicas identicas, resultaron practicamente deterministas.
#
# POR QUE EXISTE. Medido sobre esas 3 replicas (34 tareas, gpt-oss:20b), la
# inestabilidad de una tarea NO sigue a su dificultad sino al LARGO DE SU
# TRAYECTORIA, y con umbral en vez de pendiente:
#
#     0-3 rondas:   0/2  inestables (  0%)
#     3-6 rondas:   1/14 inestables (  7%)
#     6-10 rondas:  5/7  inestables ( 71%)
#     10+ rondas:   6/11 inestables ( 55%)
#
#   estables:   n=22, 6.3 rondas, 132s, 1002 tokens de salida
#   inestables: n=12, 11.4 rondas, 264s, 1742 tokens
#
# Mecanismo plausible: cada ronda es una oportunidad de que un empate de
# logits se resuelva distinto, y una trayectoria que diverge NO vuelve a
# converger. Ramificacion con estado absorbente -> umbral, no pendiente.
#
# COSTO Y USO. ~15 min por corrida contra los ~94 de la suite completa, con
# 1 sola tarea inestable de 13. Es el instrumento para trabajo
# RUTINARIO: regresiones, verificar que un cambio no rompio nada, iterar
# sobre palancas baratas. Para medir efectos en tareas de edicion pesada hay
# que pagar la suite completa Y repeticiones, porque ahi el ruido por tarea
# ronda el 20% y solo se promedia replicando.
#
# NO sirve para: medir palancas cuyo efecto viva en trayectorias largas
# (compactacion, colapso ACI, recuperacion de errores). Por construccion,
# aca casi no hay trayectorias largas.
#
# REQUISITOS DE CORRIDA (los mismos de discriminating.toml):
#   - `source ~/.cargo/env` -- sin cargo en el PATH el grading califica todo
#     como fallado y el post-edit check se salta en silencio.
#   - BRAZE_OLLAMA_NUM_CTX=32768, BRAZE_MAX_TOKENS=12288
#   - --task-timeout-secs 900

[[tasks]]
id = "editar_lote_3_temprano"
skill = "localizacion"
prompt = "En src/lib.rs, la funcion peso_lote_3 usa un factor de ajuste de 0.01. Cambialo a 0.05 sin tocar ninguna otra funcion peso_lote."
expect_cargo_check = true
expect_file_contains = { "src/lib.rs" = ["let ajuste = 3.0 * 0.05;", "let ajuste = 2.0 * 0.01;"] }
expect_max_rounds = 8

[tasks.setup_files]
"Cargo.toml" = '''
[package]
name = "inventory"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
'''
"src/lib.rs" = '''

#[derive(Debug, Clone, PartialEq)]
pub struct Item {
    pub sku: String,
    pub cantidad: u32,
    pub precio_centavos: u64,
}

impl Item {
    pub fn new(sku: &str, cantidad: u32, precio_centavos: u64) -> Self {
        Self { sku: sku.to_string(), cantidad, precio_centavos }
    }

    /// Valor total de la linea, en centavos.
    pub fn valor_total(&self) -> u64 {
        self.precio_centavos * u64::from(self.cantidad)
    }

    pub fn esta_agotado(&self) -> bool {
        self.cantidad == 0
    }
}

#[derive(Debug, Default)]
pub struct Almacen {
    items: Vec<Item>,
}

impl Almacen {
    pub fn new() -> Self {
        Self { items: Vec::new() }
    }

    pub fn agregar(&mut self, item: Item) {
        self.items.push(item);
    }

    pub fn len(&self) -> usize {
        self.items.len()
    }

    pub fn is_empty(&self) -> bool {
        self.items.is_empty()
    }

    /// Valor total del inventario, en centavos.
    pub fn valor_inventario(&self) -> u64 {
        self.items.iter().map(Item::valor_total).sum()
    }

    pub fn agotados(&self) -> Vec<&Item> {
        self.items.iter().filter(|i| i.esta_agotado()).collect()
    }

    pub fn buscar(&self, sku: &str) -> Option<&Item> {
        self.items.iter().find(|i| i.sku == sku)
    }
}


