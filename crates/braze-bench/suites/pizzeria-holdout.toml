# Suite HELD-OUT del pre-registro experto-por-motor
# (docs/hypothesis-2026-08-26-experto-por-motor-qlora.md).
#
# CONGELADA el 2026-08-29, ANTES de exportar el JSONL y antes de
# entrenar. El pre-registro lo exige: "se construye y se commitea ANTES
# de entrenar, y no se toca después". Ampliarla o ajustarla a la vista
# de resultados invalidaría el experimento.
#
# QUÉ MIDE. Generalización sobre el MISMO motor `pizzeria.py` (verbatim
# del piloto, byte por byte) con tareas que NO están en el set de
# entrenamiento. Si el alumno destilado sube acá, aprendió a operar el
# motor; si sube solo en `pizzeria-pilot.toml`, memorizó 16
# trayectorias.
#
# CONTAMINACIÓN CRUZADA. Ninguna respuesta esperada coincide con una
# entrenada. Los valores que el set de entrenamiento enseña son 11900
# (napolitana familiar) y 19800 (napolitana familiar + margarita
# mediana); acá no aparece ninguno de los dos. Responder 11900 a una
# pregunta de precio de esta suite es, por construcción, aplicar el
# valor de una tarea entrenada a una held-out — el efecto de Ren &
# Sutherland (§ 4.1) hecho observable.
#
# COBERTURA, 12 tareas contra las 6 del entrenamiento:
#   - 3 precios de ítems distintos del entrenado
#   - 3 totales con composiciones distintas
#   - 3 recuperaciones de error con modos de fallo DISTINTOS al
#     entrenado (que era pizza inexistente): tamaño inválido, agregar
#     tras confirmar, comando desconocido
#   - 2 de estado (pedido vacío, confirmar y verificar)
#   - 1 distractor nuevo, sobre un ítem no entrenado
#
# El pre-registro autorizaba 12+ "si se puede sin inflar el costo": son
# 12, y a ~60 s/tarea en ornith son ~12 min por brazo.

