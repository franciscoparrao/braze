# Third B variant (2026-07-17, docs/paper2-memory-distillation-protocol-2026-07-16.md
# § "Hallazgo del piloto M1"): the "none"/"human-playbook" pair saturates (ceiling,
# memorized bug); the "loop" pair has headroom but the playbook showed no round
# reduction there (net token cost went UP, not down). This third pair asks whether
# that null result is the norm or the loop task was atypical -- same family
# (rust_compile_repair), same generic human playbook, but a different error class
# entirely: E0382 "use of moved value" (the playbook's own applies_when explicitly
# lists E0499/E0502/E0382), not another E0502 variant.
#
# Two design lessons from the loop pair's debugging applied up front, not discovered
# the hard way again: (1) zero string literals anywhere in setup_files/fix, so no
# tool-call JSON-escaping trap is possible; (2) the minimal fix reuses the EXISTING
# `owned_items` binding (swap `self.items.len()` -> `owned_items.len()`) instead of
# introducing a new identifier, so there's no naming-diversity axis for
# `expect_file_contains` to be brittle against the way `additions`/`new_words` was.
[[tasks]]
id = "rust_move_fix_none"
skill = "memory_transfer_b_move"
prompt = "Fix src/lib.rs so cargo check passes. Keep the public function names unchanged."
expect_file_contains = { "src/lib.rs" = ["let mut owned_items = self.items;", "owned_items.len()"] }
expect_cargo_check = true
expect_max_rounds = 8
expect_max_tokens = 12000

[tasks.setup_files]
"Cargo.toml" = "[package]\nname = \"move_pilot\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[lib]\npath = \"src/lib.rs\"\n"
"src/lib.rs" = "pub struct Batch {\n    items: Vec<String>,\n}\n\nimpl Batch {\n    pub fn new(items: Vec<String>) -> Self {\n        Self { items }\n    }\n\n    pub fn total_chars(&self) -> usize {\n        self.items.iter().map(|s| s.len()).sum()\n    }\n\n    pub fn consume_and_count(self) -> (usize, usize) {\n        let total = self.total_chars();\n        let mut owned_items = self.items;\n        owned_items.sort();\n        (total, self.items.len())\n    }\n}\n"

