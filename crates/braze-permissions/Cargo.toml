[package]
name = "braze-permissions"
description = "Two-layer permission model: working-dir allowlist + irreversible-action confirmation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
braze-types = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# Landlock write-only (v9 Paquete 4): sandbox de escrituras a nivel de
# kernel, Linux-only por naturaleza (LSM Landlock, mainline desde 5.13).
# En otros SO el módulo `sandbox` compila un stub que reporta NotEnforced.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2.189"
seccompiler = "0.5.0"
