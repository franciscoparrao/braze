[package]
name = "braze-memory"
description = "Cross-session project memory: a small, deterministic, git-versionable summary distinct from SessionStore's per-conversation replay (docs/project-memory-design.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Workspace tokio doesn't enable "fs" (see workspace Cargo.toml) — this
# crate needs it for FileProjectMemoryStore's async read/write, same
# local-override pattern as braze-session.
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
